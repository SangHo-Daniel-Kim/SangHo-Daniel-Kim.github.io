    title: Life
    subtitle: trying things, finding questions

life_intro:
  - "<strong>TL;DR: Why I want to pursue a PhD.</strong> Unlike many CS students, I spent much of my sophomore year in the public sector, exploring technology policy and diplomacy, believing that shaping the institutions around emerging technologies could be a meaningful way to influence how AI affects society."
  - "Over time, however, I became increasingly aware of the discrepancy between high-level discussions and the realities of technological development. In a field fast-paced and cutting-edge, I felt that trying to shape its direction firsthand without understanding the current state of the field left too much of the big picture missing."
  - "That realization brought me back to research. I realized that the most fundamental way to contribute to both society and the field is <strong>to engage directly with the technology itself and help build what comes next</strong>."
  - "That is my motivation for pursuing a PhD."

life_chapters:
  - id: exploring
    era: "~High School (~2020)"
    title: Exploring Before Knowing
    paragraphs:
      - "Until high school, I was probably more interested in art than in technology. For a while, I seriously considered going to film school. Ever since middle school, I had worked in school broadcasting clubs, where I loved handling cameras, shooting and editing videos, and showing something I had made to other people."
      - "One of my biggest projects during high school was a [short film](https://www.youtube.com/watch?v=YnsKKiO44rY&t=3s) (2018) for the school arts festival, loosely inspired by the movie *Her* (falling in love with an AI &mdash; in hindsight, quite a coincidence!). With no professional experience whatsoever, I had a blast hacking together filmmaking techniques from scratch, including (1) faking smooth dolly shots by <span class='reveal'><input type='checkbox' id='rv-dolly' class='reveal-toggle'><label for='rv-dolly' class='reveal-box'><span class='reveal-cue'>answer</span><span class='reveal-text'>resting the camera on a sheet of paper and dragging it</span></label></span>, and (2), since CG was out of the question, <span class='reveal'><input type='checkbox' id='rv-rain' class='reveal-toggle'><label for='rv-rain' class='reveal-box'><span class='reveal-cue'>answer</span><span class='reveal-text'>scrambling everyone to shoot our rain scenes whenever it actually started raining</span></label></span>. Armed with nothing but an old school camera, a 2G cellphone for a microphone, and a bunch of boys trying to talk to a student ID card (yes, that is the plot), we somehow pulled it off after 1 year of filming."
      - "That was the first time I felt what it meant to pour an enormous amount of time and effort into a single project. For me, it was also the moment when I first felt that *[we've made something wonderful](https://www.youtube.com/watch?v=pIwlbAaZ3cs)* feeling."
      - "I also loved writing and regularly participated in essay competitions. My last essay was published in my school's literary journal for future students to read. Titled &ldquo;What Art Means to a STEM Student,&rdquo; and inspired by Steve Jobs&rsquo; 2005 Stanford commencement speech on &ldquo;connecting the dots,&rdquo; I wrote about how art can fill in the gaps in technology and science. You can [read it here](#) (I've included an AI-translated version, and I hope my rough thoughts still come through)."
      - "Until then, I did not have a particular major in mind. Even in a high-pressure environment focused on exams and admissions, I took quiet pride in chasing things that seemed unrelated &mdash; film, photography, writing, and whatever else caught my eye. At the time, I simply felt there were things I could only explore while I was still a student, so I kept reaching for many different interests without knowing how those dots would connect. (Looking back, I guess some of those dots eventually connected through computer vision and natural language processing.)"
      - "With all those dots still unconnected, AI somehow seemed like a natural place to start. Recalling [AlphaGo’s match against Lee Sedol in 2016](https://deepmind.google/research/alphago/), I remember having this fuzzy feeling of science fiction becoming real. I was fascinated by the idea that machines could somehow replicate parts of human intelligence. More than anything, I hoped AI might be where my scattered interests would eventually connected to. That was enough to send me down the rabbit hole."

  - id: college-air-force
    era: "FRESHMAN & AIR FORCE (~2024)"
    title: Finding What AI Could Be Used For
    paragraphs:
      - "My first year of college did not immediately give me an answer. Still quite uncertain, I enlisted in the Air Force. Military life initially felt disconnected from everything I had known, but that isolation also gave me some kind of inner peace to think without constantly comparing myself with others or worrying about the noise from outside."
      - "I was eventually assigned to the Air Force Operations Command, working around the ROK&ndash;U.S. combined communications systems. Things changed when my junior colleague [Edward Song](https://www.linkedin.com/in/edwardjhoon/) from CMU SDS, came to me with a problem his office was facing after a [series of incidents](https://www.airandspaceforces.com/videos-usaf-f-16-crash-south-korea/) involving emergency sorties in the fall of 2023. We started looking into problems in the Air Tasking Order (ATO) 3-day production process and searched for solutions."
      - "Due to security restrictions, we worked with whatever scraps we could get our hands on &mdash; technical reports, military publications, defense research documents, and even some old materials whose publication dates we could barely figure out. We also got the rare chance to meet our U.S. Air Force counterparts in the operational planning office and compare how their systems were organized and operated. I still remember those nights when Ed and I would sneak into the drying room after our night shift, sketching out the system pipeline and arguing over possible module options using RL, DQNs, and recommender systems."
      - "Eventually, [our proposal](/assets/pdf/AI-based_ATO_Rec_Sys_ENG_ver_SanghoKim.pdf) received first-place recognition from the Air Force's New Technology Development Team and the Office of the commander, and later led to an interview with executives at Palantir Technologies, which was pretty cool. But what stayed with me more was the feeling that, for the first time, I had actually used AI to solve a real-life problem around me. That was when I started to recognize AI not just as a field to study, but as a general-purpose tool for solving problems."
      - "With that realization, I started participating in several competitions across public domains like national defense, healthcare, diplomacy, and more. Long story short, I found that what I enjoyed most was <strong>the process of problem solving</strong> itself: defining a problem, discussing it, solidifying an idea, and proving that it actually works."
      - "Much later, I realized that research was not so different."

  - id: policy-research
    era: "POST-SERVICE, SOPHOMORE YEAR (~2025)"
    title: From Government Stuff Back to Research
    paragraphs:
      - "My time in the military left me with a stronger desire to contribute to something beyond myself—to the greater good. Watching the world change after ChatGPT was released during my service, I knew I wanted to use this new wave of technology to create broader social impact. Maybe that is why, after my ETS, I ended up participating in so many government-related programs and DS competitions."
      - "It did not take long for me to notice how fragile the bridge between technology and the public sector was in South Korea. My best friend Yongbin, who was interning at the Ministry of Foreign Affairs at the time, often emphasized the need for new professionals with engineering backgrounds in his sector. With the AI transformation going on and all that jazz, I somehow felt that it was <strong>the role of our generation to help lay the groundwork for how these technologies would be adopted and governed</strong>. From afar, that seemed like a pretty meaningful path."
      - "So during my sophomore year, I took on some AI policy advisory work at the [Ministry of Science and ICT](https://www.msit.go.kr/bbs/view.do?sCode=user&nttSeqNo=3185384&bbsSeqNo=94), participated in public diplomacy programs (LHC, [YTL](https://jp.usembassy.gov/young-trilateral-leaders-summit-in-osaka-us-japan-korea/), [AHDA](https://kr.usembassy.gov/education-exchanges/american-diplomacy-house/)), and joined discussions on the responsible use of emerging technologies through [TechCamp](https://kr.usembassy.gov/2024techcamp/). I have to say, policymaking was a pretty rare experience—and a little scary—especially when I saw some of my own ideas make their way directly onto policymakers' desks. Diplomacy also involved a lot of talking, meetings, and meeting new people, which, as an extrovert, I definitely enjoyed."
      - "But the closer I got, the more cautious I became. As my voice started to carry more weight, I kept asking myself: Am I actually helping steer things in the right direction, or am I just nerfing a legendary sword without fully understanding how it works? Sometimes the questions were more lower-level. Every country seemed desperate to secure NVIDIA GPUs for AI—but what exactly do we need GPUs for in AI? Surprisingly, I realized that the actual policymakers were asking the same questions themselves."
      - "That 'knowledge gap' between scientists and non-scientists started to bother me. Technical details easily got lost as they moved into higher-level of policy discussions, while researchers' concerns did not always translate into something policymakers could actually act on. I began to feel that, before trying to shape technology starting from the outside, I wanted to understand it thoroughly from the inside first."
      - "So that is how I eventually returned to research. I also knew I wanted to work on something a little less crowded—probably an old habit of being drawn to things other people were not doing. If AI was supposed to resemble human intelligence, I became curious about the soft skills that make us human, rather than only the hard skills like recognition, classification, and generation that were already receiving so much attention."
      - "Luckily, thanks to [Prof. Lee](https://sites.google.com/view/sangmin-lee/home), who was my PI at the time, I was introduced to <strong>Artificial Social Intelligence</strong> and eventually settled into studying <strong>multimodal human interaction</strong>. The following question caught my attention."
      - '<blockquote class="about-life-pullquote"><p>How can intelligent machines read the room—both verbal and nonverbally—like social animals?</p></blockquote>'
      - "I believe that solving this problem could unlock unprecedented abilities in building human-like physical intelligence."

  - id: ut-austin
    era: "EXCHANGE, JUNIOR YEAR (~NOW)"
    title: Toward Social and Physical Intelligence at UT Austin
    paragraphs:
      - "Fully funded by the government, my one-year visit to UT Austin was when I developed a clearer vision for how to answer the question above."
      - "Taking Prof. Grauman&rsquo;s [CS381V Visual Recognition (Grad)](https://www.cs.utexas.edu/~grauman/courses/fall2025/) and Prof. Pavlakos&rsquo;s [CS 395T Learning for 3D Vision (Grad)](https://sites.google.com/utexas.edu/cs395t-spring2026?pli=1), I encountered novel methods in computer vision (e.g. human mesh recovery, scene reconstruction) that gave my research a whole new direction. Noticing that much of the current work on interaction perception still relies on classical 2D keypoints or implicit representations, I decided to combine this line of work with 3D/4D vision. Here, my research has focused on three interaction settings:"
      - "<strong>Human&ndash;human interaction.</strong> Project: <em>Modeling Multimodal Social Interaction with 4D Human Body Mesh</em><br>Heavily inspired by [4DHumans](https://shubham-goel.github.io/4dhumans/) and [PHALP](https://arxiv.org/abs/2112.04477), I worked with [Prof. Pavlakos](https://geopavlakos.github.io/) on using 4D human motion and spatial cues to tackle multimodal social deduction tasks, combining spatiotemporal interaction understanding with BERT-style backbones. (Fun fact: this project actually grew out of an older proposal of mine that my PI had rejected back in 2024 because we had no clear idea how to make it work&mdash;it sounded a bit too much like science fiction at the time!)"
      - "<strong>Human&ndash;environment interaction.</strong> Project: <em>3D Deictic Gesture Target Estimation with Human&ndash;Scene Reconstruction</em><br>For my final project in CS 395T, I developed GeoGesture using [CUT3R](https://cut3r.github.io/) and [Human3R](https://fanegg.github.io/Human3R/), a geometry-aware framework that reconstructs a person and the surrounding environment from a single RGB image in a shared 3D space, then reasons over that geometry to identify the intended target of deictic gestures. We demonstrated how explicit 3D reasoning can help social robots better understand people in human-centered environments (even without a word!)."
      - "<strong>Egocentric, personalized experience.</strong> Project: [Personalized Visual Context Learning in Large Multimodal Models](https://vision.cs.utexas.edu/projects/PersonalVCL/)<br>Collaborating with [Dr. Zihui Xue](https://zihuixue.github.io/) and [Prof. Kristen Grauman](https://www.cs.utexas.edu/~grauman/), I explored how multimodal models can learn from a person&rsquo;s egocentric visual history&mdash;the people they interact with, the objects around them, and their everyday behaviors&mdash;to better understand new experiences in a personalized way."
      - "To me, it seems like a reasonable next step for social intelligence to understand the physical scene beyond the image plane. After all, humans understand one another not only through words, but also through body language, spatial relationships, and our connections with the world around us."
      - "But, as my mentor [Evonne Ng](https://evonneng.github.io/) from Meta Superintelligence Lab once put it, “it is a niche topic.” I believe there is still a lot to figure out, but at the same time, there simply isn’t enough data to figure it out with."
      - "During my PhD, I want to push this direction further by <strong>(1) building models that understand human interactions</strong> in their physical and social context, while also <strong>(2) creating new multimodal datasets and benchmarks</strong> that open up more room for the broader research community to explore the problem."
    # closing_quote: How can we build intelligent machines that understand people, their interactions, and the physical world well enough to meaningfully participate in it?

